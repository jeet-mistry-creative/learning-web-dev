<!DOCTYPE html>
<html>
    <head>
        <title>
            Day 12: Create a Student marksheet
        </title>
    </head>
    <body>
        
        <table border="1">
            <tr>
                <th colspan="5">
                    Student Marksheet
                </th>
            </tr>
            <tr>
                <th>Roll No</th>
                <th>Name</th>
                <th>Subject</th>
                <th>Marks</th>
                <th>Result</th>
            </tr>
            <tr>
                <td rowspan="2">1</td>
                <td rowspan="2">Jeet</td>
                <td>HTML</td>
                <td>85</td>
                <td rowspan="2">Pass</td>
            </tr>
            <tr>
                <td>CSS</td>
                <td>78</td>
            </tr>
            <tr>
                <td>2</td>
                <td>Meet</td>
                <td>JavaScript</td>
                <td>65</td>
                <td>Pass</td>
            </tr>
        </table>
    </body>
</html>
