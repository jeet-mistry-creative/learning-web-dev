<!DOCTYPE html>
<html>
    <head>
        <title>Day 11: Create a Registration Form</title>
    </head>
    <body>
        
        <form action="#">

            <h2>Registration Form</h2>

            <fieldset>
                <legend>Personal Info</legend>
                <br><br>
                <label for="name">Name:</label>
                <input type="text" id="name" placeholder="enter your name" minlength="5" required>
                <br><br>
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="abc@gmail.com" required>
                <br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" placeholder="Enter your password" minlength="6" required>
                <br><br>
                <label for="age">Age:</label>
                <input type="number" id="age" placeholder="age" min="10" max="60" required>
                <br><br>
                <label>Gender:</label><br>

                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
                <br><br>

                <label>Skills:</label><br>
                <input type="checkbox" id="html" name="skills" value="html">
                <label for="html">HTML</label>
                <input type="checkbox" id="css" name="skills" value="css">
                <label for="css">CSS</label>
                <input type="checkbox" id="js" name="skills" value="javascript">
                <label for="js">JavaScript</label>
                <br><br>

                <label for="country">Country:</label>
                <select id="country" required>
                    <option value="select">Select...</option>
                    <option value="india">India</option>
                    <option value="usa">USA</option>
                    <option value="uk">UK</option>
                    <option value="other">Other</option>
                </select>
                <br><br>

                <label for="message">Message:</label>
                <textarea id="message" minlength="10" required></textarea>

            </fieldset>


            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </body>
</html>
